server:
  port: 8080

spring:
  application:
    name: modular-monolith
  profiles:
    active: dev

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

---
# Development Profile (H2 In-Memory with PostgreSQL compatibility mode for instant local execution)
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:monolithdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
